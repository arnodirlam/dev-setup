#:schema https://raw.githubusercontent.com/openai/codex/main/codex-rs/core/config.schema.json

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
personality = "friendly"
approval_policy = "on-request"
approvals_reviewer = "guardian_subagent"
sandbox_mode = "workspace-write"

[mcp_servers.context7]
args = ["--bun", "@upstash/context7-mcp"]
command = "bunx"
enabled = true

[features]
multi_agent = true
undo = true
guardian_approval = true
prevent_idle_sleep = true
workspace_dependencies = false
hooks = true
multi_agent_v2 = true

[[hooks.SessionStart]]
matcher = "^(startup|resume)$"

[[hooks.SessionStart.hooks]]
type = "command"
command = "bash ~/.codex/hooks/setup-worktree-envrc.sh"
timeout = 5
statusMessage = "Ensure .evnrc is set up (worktrees only)"

[[hooks.PreToolUse]]
matcher = ".*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "bash -lc 'payload=$(cat); command=$(printf \"%s\" \"$payload\" | jq -r '\\''(.toolInput.command // .tool_input.command // .command // (try (.toolArgs | fromjson | .command) catch empty) // (try (.tool_args | fromjson | .command) catch empty) // .toolArgs.command // .tool_args.command // empty)'\\''); if printf \"%s\\n\" \"$command\" | grep -Eq '\\''(^|[;&|[:space:]])git[[:space:]]+([^;&|[:space:]]+[[:space:]]+)*(add|commit|reset|rm|mv|update-index|checkout-index|read-tree)([[:space:]]|$)|(^|[;&|[:space:]])git[[:space:]]+([^;&|[:space:]]+[[:space:]]+)*restore([^;&|]*[[:space:]])--staged([[:space:]]|$)|(^|[;&|[:space:]])git[[:space:]]+([^;&|[:space:]]+[[:space:]]+)*apply([^;&|]*[[:space:]])--(cached|index)([[:space:]]|$)|(^|[;&|[:space:]])git[[:space:]]+([^;&|[:space:]]+[[:space:]]+)*stash([^;&|]*[[:space:]])--staged([[:space:]]|$)'\\''; then echo \"Blocked: Codex may not change Git staged state or create commits.\" >&2; exit 2; fi'"
timeout = 5
statusMessage = "Checking Git index safety"

[sandbox_workspace_write]
network_access = true
writable_roots = [
  "/Users/arno/.cache/nix",
  "/Users/arno/.cache/uv",
  "/Users/arno/.cache/zig",
  "/Users/arno/.dev-browser",
  "/Users/arno/.hex",
  "/Users/arno/.local/share/mise",
  "/Users/arno/.mise",
  "/Users/arno/.npm",
  "/Users/arno/.npm_ex",
  "/Users/arno/.ollama",
]

[desktop]
sansFontSize = 15
codeFontSize = 14
usePointerCursors = true
mac-menu-bar-enabled = false
followUpQueueMode = "queue"
reviewDelivery = "inline"
localeOverride = "en-US"
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = false
git-pull-request-merge-method = "squash"
git-show-sidebar-pr-icons = true
git-commit-instructions = """
Always use single-line commit messages with the following structure:

- Broad code area/module (one or two words) with a colon `:` and space, if applicable, e.g. "CI: "
- Capitalized verb in imperative form, e.g. "Add "
- Specific but short description of the change - every word counts
- use commas and ampersand `&` for enumerations
- Separate multiple changes in the same area by comma `,`, e.g. "Add tests, Update config"
- Separate areas by semicolon `;`, e.g. "CI: Cache build dir; Justfile: Add `check` command""""
notifications-turn-mode = "always"
conversationDetailMode = "STEPS_COMMANDS"
show-context-window-usage = true
dock-icon-preference = "codex-system"

[desktop.open-in-target-preferences]
global = "cursor"
